name: Update neXa documentation

on:
  push:
    branches:
      - main
      - master
    paths:
      - "profile/README.md"

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger neXa documentation deployment
        run: |
          curl -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.NEXA_DOCS_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/TcNexa/nexa-docs/dispatches \
            -d '{"event_type":"organization-readme-updated"}'
